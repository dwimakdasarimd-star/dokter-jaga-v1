<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
<title id="title">Jaga — Dokter Jaga mascot</title>
<desc id="desc">Modern friendly owl doctor mascot with pointed ear tufts, smaller expressive eyes, white coat and clinical handbook.</desc>
<defs>
